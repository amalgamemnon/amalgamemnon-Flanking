# Pushing a version tag (e.g. 2.0.0) builds the module, creates the GitHub release, and publishes the version
# to foundryvtt.com. module.json's "version" and "download" must already match the tag.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Check module.json matches the tag
        run: |
          version=$(jq -r .version module.json)
          download=$(jq -r .download module.json)
          expected="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/module.zip"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=module.json::version is $version, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          if [ "$download" != "$expected" ]; then
            echo "::error file=module.json::download should be $expected"
            exit 1
          fi

      - name: Build module.zip
        run: zip module.zip module.json flanking-override.js geometry.js LICENSE README.md CHANGELOG.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="$GITHUB_REF_NAME" '$1 == "##" { found = ($2 == tag); next } found' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" module.json module.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

  foundry:
    name: Publish to foundryvtt.com
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The foundryvtt.com listing was registered with a capital F, and its release API is case-sensitive
      PACKAGE_ID: ${{ vars.FOUNDRY_PACKAGE_ID || 'amalgamemnon-Flanking' }}
      FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for the release token
        run: |
          if [ -z "$FOUNDRY_RELEASE_TOKEN" ]; then
            echo "::error::Add the Package Release Token from the foundryvtt.com package page as the FOUNDRY_RELEASE_TOKEN repository secret."
            exit 1
          fi

      - name: Publish (dry run first)
        run: |
          releases="https://github.com/$GITHUB_REPOSITORY/releases"

          publish() {
            jq -n \
              --arg id "$PACKAGE_ID" \
              --argjson dryRun "$1" \
              --arg version "$GITHUB_REF_NAME" \
              --arg manifest "$releases/download/$GITHUB_REF_NAME/module.json" \
              --arg notes "$releases/tag/$GITHUB_REF_NAME" \
              --argjson compatibility "$(jq .compatibility module.json)" \
              '{id: $id, "dry-run": $dryRun, release: {version: $version, manifest: $manifest, notes: $notes, compatibility: $compatibility}}' \
              > payload.json

            # Foundry allows one release per package per 60 seconds and answers 429 with Retry-After
            for attempt in 1 2 3; do
              code=$(curl -sS -o response.json -D headers.txt -w '%{http_code}' -X POST \
                https://foundryvtt.com/_api/packages/release_version/ \
                -H "Content-Type: application/json" \
                -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
                --data @payload.json)
              if [ "$code" != 429 ]; then break; fi
              wait=$(grep -i '^retry-after:' headers.txt | tr -dc '0-9' || true)
              echo "Rate limited, retrying in ${wait:-60}s"
              sleep "${wait:-60}"
            done

            # Foundry answers errors such as a bad token or package ID with plain text, not JSON
            echo "HTTP $code: $(cat response.json)"
            if ! jq -e '.status == "success"' response.json > /dev/null 2>&1; then
              echo "::error::foundryvtt.com rejected the release (HTTP $code): $(cat response.json)"
              if [ "$code" = 403 ]; then
                echo "::error::Check the FOUNDRY_RELEASE_TOKEN secret, and that the package ID ($PACKAGE_ID) matches foundryvtt.com exactly, including capitals. Set the FOUNDRY_PACKAGE_ID repository variable to override it."
              fi
              exit 1
            fi
          }

          publish true
          publish false
